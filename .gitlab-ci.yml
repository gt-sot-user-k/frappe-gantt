default:
  image: node:latest

stages:
  - publish

build-and-publish:
  stage: publish
  tags: [ docker ]
  script:
    - npm i
    - npm run build
    - echo "//${REGISTRY_HOST}/:_authToken=\"${REGISTRY_HOST_AUTH_TOKEN}\"" | tee -a .npmrc
    - npm publish --force
  only:  
    - master
    - release
