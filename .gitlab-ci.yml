default:
  image: node:latest

stages:
  - build
  - deploy

build-package:
  stage: build
  script:
    - npm run build
  only:  
    - master
    - release
    - /^feature\/.*$/

publish-npm:
  stage: deploy
  script:
    - echo "//${REGISTRY_HOST}/:_authToken=\"${REGISTRY_HOST_AUTH_TOKEN}\"" | tee -a .npmrc
    - npm publish
  only:  
    - master
    - release
    - /^feature\/.*$/
